<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة نتائج الطلاب</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <div class="container">
        <!-- الشريط العلوي -->
        <header class="top-header">
            <div class="header-tabs">
                <button class="tab-btn active">لوحة النتائج</button>
            </div>
            <button class="theme-toggle-btn" id="themeToggleBtn" title="تبديل الوضع">🌙</button>
        </header>

        <!-- كروت الإحصائيات -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">إجمالي الطلاب</div>
                <div class="stat-value" id="totalStudentsCount">0</div>
            </div>
            <div class="stat-card stat-success">
                <div class="stat-label">الطلاب الناجحون</div>
                <div class="stat-value" id="passedStudentsCount">0</div>
            </div>
            <div class="stat-card stat-danger">
                <div class="stat-label">الطلاب الراسبون</div>
                <div class="stat-value" id="failedStudentsCount">0</div>
            </div>
            <div class="stat-card stat-info">
                <div class="stat-label">نسبة النجاح</div>
                <div class="stat-value" id="passRatePercentage">0%</div>
            </div>
        </div>

        <!-- جدول النتائج وفلترة البحث -->
        <div class="card">
            <div class="table-toolbar">
                <input type="text" id="searchTeacherTable" class="form-control search-box" placeholder="ابحث باسم الطالب أو رقم الجلوس...">
                <select id="filterStatus" class="form-control filter-box">
                    <option value="all">جميع الحالات</option>
                    <option value="nafs">الناجحون فقط</option>
                    <option value="rasb">الراسبون فقط</option>
                </select>
            </div>

            <div class="table-responsive">
                <table class="styled-table">
                    <thead>
                        <tr>
                            <th>اسم الطالب / رقم الجلوس</th>
                            <th>درجات المواد</th>
                            <th>المجموع الكلي</th>
                            <th>التقدير العام</th>
                            <th>الحالة</th>
                            <th>إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="teacherTableBody">
                        <!-- يتم استدعاء البيانات ديناميكياً بواسطة JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
